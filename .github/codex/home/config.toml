# CI-only user configuration
cli_auth_credentials_store = "file"
mcp_oauth_credentials_store = "file"

[mcp_servers.canva]
url = "https://mcp.canva.com/mcp"
required = true
startup_timeout_sec = 60

# Allow design creation without interactive approval
[mcp_servers.canva.tools."create-design"]
approval_mode = "approve"