name: Validate Codex environment
on:
  push:
    paths: ['.github/**', 'scripts/codex_ci/**', 'tests/**']
  pull_request:
    paths: ['.github/**', 'scripts/codex_ci/**', 'tests/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.24.x'
          cache: false
      - name: Install validation tools
        run: |
          python -m pip install -r scripts/codex_ci/requirements.txt
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: Check workflows, scripts, and security regressions
        run: |
          "$(go env GOPATH)/bin/actionlint" -shellcheck=''
          bash -n scripts/codex_ci/prepare.sh .github/codex/setup.sh
          python -m unittest discover -s tests -v
